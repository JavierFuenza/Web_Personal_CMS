name = "web-personal-cms"
main = "src/main.py"
compatibility_date = "2026-06-17"
compatibility_flags = ["python_workers"]

# D1: el binding "DB" debe coincidir con env.DB en el codigo.
# Rellena database_id tras: npx wrangler d1 create cms
[[d1_databases]]
binding = "cms"
database_name = "cms"
database_id = "9e99eed6-cb12-4ab3-a558-d2d14a25379f"

# R2: binding "BUCKET" para los archivos subidos.
# Setup: npx wrangler r2 bucket create cms-media
[[r2_buckets]]
bucket_name = "cms-media"
binding = "cms_media"

# Estaticos servidos por Workers Assets (no por FastAPI). public/static/form.js
# queda accesible en /static/form.js. Las rutas sin asset caen al Worker.
[assets]
directory = "public"

# Subida directa a R2 (presigned PUT). El Worker firma una URL S3 y el browser
# hace el PUT directo, sin que los bytes pasen por el Worker.
#   R2_ACCOUNT_ID: account id de Cloudflare (parte del endpoint S3 de R2).
#   R2_BUCKET:     nombre del bucket (igual que bucket_name del binding).
# Las credenciales S3 van como SECRETS (no aqui):
#   npx wrangler secret put R2_ACCESS_KEY_ID
#   npx wrangler secret put R2_SECRET_ACCESS_KEY
# (Crear el token R2 "S3 API" con permiso de escritura sobre cms-media.)
#
# CORS del bucket (permitir el PUT del browser desde el origen del CMS):
#   npx wrangler r2 bucket cors put cms-media --rules '[{
#     "allowed": {"origins": ["https://<host-del-cms>"],
#                 "methods": ["PUT"], "headers": ["content-type"]},
#     "maxAgeSeconds": 3600}]'
[vars]
R2_ACCOUNT_ID = "f4d45bb160f96ca211298a8658c8cf08"
R2_BUCKET = "cms-media"
